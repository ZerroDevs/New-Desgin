<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="Images/Logo-noBG.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع حالة الطلب | New Desgin</title>
    <meta name="description" content="تتبع حالة شحن وتجهيز طلبك خطوة بخطوة من متجر New Desgin.">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="Style/index.css?v=3.0">
    <link rel="stylesheet" href="Style/track-order.css">

    <style>
        .loading-spinner-box {
            display: none;
            text-align: center;
            padding: 2.5rem 1rem;
            color: #38bdf8;
            animation: fadeIn 0.3s ease-out;
        }

        .spinner-track {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spinTrack 0.8s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spinTrack {
            to { transform: rotate(360deg); }
        }

        .order-id-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 1rem 1.25rem;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-id-val {
            font-family: 'Outfit', 'Cairo', monospace;
            font-size: 1.15rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1px;
            direction: ltr;
        }

        .copy-id-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .copy-id-btn:hover {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
        }

        .order-items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .order-items-table th {
            text-align: right;
            padding: 10px;
            color: #94a3b8;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .order-items-table td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            font-size: 0.92rem;
        }

        .order-qty-pill {
            display: inline-block;
            background: rgba(14, 165, 233, 0.22);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #ffffff !important;
            padding: 4px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-family: 'Outfit', 'Cairo', sans-serif;
            font-size: 0.95rem;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            letter-spacing: 0.5px;
        }

        .status-badge-cancelled {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .btn-track-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 1.5rem;
            padding: 14px;
            background: linear-gradient(135deg, #15803d, #22c55e);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.98rem;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            transition: all 0.25s ease;
        }

        .btn-track-whatsapp:hover {
            background: linear-gradient(135deg, #166534, #15803d);
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div id="main-header"></div>
    <script src="Scripts/header.js"></script>
    <script src="Scripts/global-search.js"></script>

    <header class="page-header">
        <div class="container">
            <div style="font-size: 4rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite;">📦</div>
            <h1 class="page-title">تتبع حالة طلبك</h1>
            <p>أدخل رقم الطلب الخاص بك لمعرفة مرحلة التجهيز والشحن الحالية فورياً</p>
        </div>
    </header>

    <main class="container track-section">
        <div class="search-box">
            <input type="text" id="order-input" class="search-input" placeholder="ORDER_..." dir="ltr" autocomplete="off">
            <button onclick="handleTrackClick()" class="search-btn" id="btn-track-submit">تتبع الطلب الآن 🔍</button>
        </div>

        <!-- Loading State -->
        <div id="track-loading" class="loading-spinner-box">
            <div class="spinner-track"></div>
            <p style="font-size: 0.95rem; font-weight: 600;">جاري البحث عن بيانات الطلب وحالته في النظام...</p>
        </div>

        <!-- Error Message -->
        <div id="error-msg" class="error-message"></div>

        <!-- Order Result View -->
        <div id="order-result" style="display: none;">
            <div class="order-card">
                <!-- Order Header with Copy Button -->
                <div class="order-id-header">
                    <div>
                        <span style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 2px;">رقم الطلب:</span>
                        <span class="order-id-val" id="display-order-id">-</span>
                    </div>
                    <button class="copy-id-btn" onclick="copyOrderId()">
                        <span>📋</span>
                        <span id="copy-btn-text">نسخ الرقم</span>
                    </button>
                </div>

                <!-- Cancelled Notice -->
                <div id="cancelled-notice" style="display: none; text-align: center;">
                    <div class="status-badge-cancelled">
                        <span>❌</span> حالة الطلب: تم إلغاء هذا الطلب
                    </div>
                </div>

                <!-- Status Timeline -->
                <div class="status-timeline" id="status-timeline-container">
                    <!-- Pending -->
                    <div class="status-step" id="step-pending">
                        <div class="status-icon">🕒</div>
                        <div class="status-label">قيد الانتظار</div>
                    </div>
                    <!-- Processing -->
                    <div class="status-step" id="step-processing">
                        <div class="status-icon">⚙️</div>
                        <div class="status-label">قيد التجهيز</div>
                    </div>
                    <!-- Shipped -->
                    <div class="status-step" id="step-shipped">
                        <div class="status-icon">🚚</div>
                        <div class="status-label">خرج للتوصيل</div>
                    </div>
                    <!-- Completed -->
                    <div class="status-step" id="step-completed">
                        <div class="status-icon">✅</div>
                        <div class="status-label">تم التسليم</div>
                    </div>
                </div>

                <!-- Order Details Grid -->
                <div class="order-info-grid">
                    <div class="info-item">
                        <label>تاريخ ووقت الطلب</label>
                        <span id="order-date">-</span>
                    </div>
                    <div class="info-item">
                        <label>المجموع الإجمالي</label>
                        <span id="order-total" dir="ltr">-</span>
                    </div>
                    <div class="info-item" id="customer-info-box" style="display: none;">
                        <label>اسم العميل والهاتف</label>
                        <span id="order-customer-info">-</span>
                    </div>
                    <div class="info-item" id="address-info-box" style="display: none;">
                        <label>عنوان التوصيل</label>
                        <span id="order-address-info">-</span>
                    </div>
                    <div class="info-item" style="grid-column: 1 / -1;">
                        <label>المنتجات المشمولة في الطلب</label>
                        <div id="order-items-wrapper">
                            <span id="order-items">-</span>
                        </div>
                    </div>
                </div>

                <!-- WhatsApp Support for this Order -->
                <a href="#" target="_blank" class="btn-track-whatsapp" id="btn-order-whatsapp">
                    <span>💬</span>
                    <span>الاستفسار والمتابعة عبر واتساب بخصوص هذا الطلب</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="main-footer"></div>
    <script src="Scripts/footer.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="Scripts/firebase-config.js"></script>

    <script src="Scripts/cart.js"></script>
    <script src="Scripts/app.js?v=3.0"></script>

    <script>
        let currentLoadedOrderId = '';
        let supportPhoneNumber = '218916808225';

        function getOrderIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            // Check all possible query parameter variations
            let id = params.get('orderId') || params.get('id') || params.get('order_id') || params.get('orderID') || params.get('ORDERID');
            if (!id && window.location.hash) {
                const hash = window.location.hash.replace('#', '').trim();
                if (hash.startsWith('ORDER_') || hash.includes('orderId=')) {
                    id = hash.replace('orderId=', '');
                }
            }
            return id ? id.trim() : null;
        }

        function handleTrackClick() {
            const input = document.getElementById('order-input');
            if (!input) return;
            const val = input.value.trim().replace(/^#/, '');
            if (val) {
                trackOrder(val);
            } else {
                const errorDiv = document.getElementById('error-msg');
                errorDiv.textContent = 'يرجى إدخال رقم الطلب أولاً';
                errorDiv.style.display = 'block';
                input.focus();
            }
        }

        async function trackOrder(targetId) {
            const input = document.getElementById('order-input');
            const resultDiv = document.getElementById('order-result');
            const errorDiv = document.getElementById('error-msg');
            const loadingDiv = document.getElementById('track-loading');

            const orderId = (targetId || (input ? input.value : '')).trim().replace(/^#/, '');
            if (!orderId) return;

            if (input) input.value = orderId;
            currentLoadedOrderId = orderId;

            // Reset UI States
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            // Ensure store phone is loaded
            if (window.firebase && firebase.database) {
                firebase.database().ref('settings/phone').once('value', snap => {
                    if (snap.exists() && snap.val()) {
                        supportPhoneNumber = String(snap.val()).replace(/[^0-9]/g, '');
                    }
                });
            }

            try {
                let orderData = null;
                let finalKey = orderId;

                // 1. Direct fetch by key
                const directSnap = await firebase.database().ref('orders/' + orderId).once('value');
                if (directSnap.exists()) {
                    orderData = directSnap.val();
                    finalKey = directSnap.key;
                } else {
                    // 2. Query by orderId child attribute
                    const querySnap = await firebase.database().ref('orders').orderByChild('orderId').equalTo(orderId).once('value');
                    if (querySnap.exists()) {
                        querySnap.forEach(child => {
                            orderData = child.val();
                            finalKey = child.key;
                        });
                    } else {
                        // 3. Case-insensitive or trimmed fallback search
                        const allOrdersSnap = await firebase.database().ref('orders').limitToLast(50).once('value');
                        if (allOrdersSnap.exists()) {
                            allOrdersSnap.forEach(child => {
                                const val = child.val();
                                const cKey = child.key || '';
                                const cOrdId = val.orderId || '';
                                if (cKey.toLowerCase() === orderId.toLowerCase() || cOrdId.toLowerCase() === orderId.toLowerCase()) {
                                    orderData = val;
                                    finalKey = child.key;
                                }
                            });
                        }
                    }
                }

                loadingDiv.style.display = 'none';

                if (orderData) {
                    displayOrder(orderData, finalKey);
                } else {
                    errorDiv.textContent = `عذراً، لم يتم العثور على طلب برقم "${orderId}". يرجى التأكد من كتابة الرقم بشكل صحيح.`;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Error tracking order:', error);
                loadingDiv.style.display = 'none';
                errorDiv.textContent = 'حدث خطأ أثناء محاولة الاتصال بقاعدة البيانات. يرجى المحاولة مجدداً.';
                errorDiv.style.display = 'block';
            }
        }

        function displayOrder(order, keyId) {
            const resultDiv = document.getElementById('order-result');
            const displayId = order.orderId || keyId || currentLoadedOrderId;
            document.getElementById('display-order-id').textContent = displayId;

            // Date & Time
            const dateObj = order.timestamp ? new Date(order.timestamp) : new Date();
            const dateStr = dateObj.toLocaleDateString('ar-LY', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = dateObj.toLocaleTimeString('ar-LY', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('order-date').textContent = `${dateStr} (${timeStr})`;

            // Total & Currency
            let totalFormatted = '';
            if (order.finalTotal !== undefined || order.total !== undefined) {
                const totalNum = Number(order.finalTotal !== undefined ? order.finalTotal : order.total);
                const currency = order.currency || 'LYD';
                totalFormatted = currency === 'LYD' ? `${totalNum.toFixed(2)} د.ل` : `$${totalNum.toFixed(2)}`;
            } else {
                totalFormatted = 'غير محدد';
            }
            document.getElementById('order-total').textContent = totalFormatted;

            // Customer Info & Address if available
            const customerBox = document.getElementById('customer-info-box');
            const addressBox = document.getElementById('address-info-box');

            if (order.customerName || order.customerPhone) {
                const name = order.customerName || '';
                const phone = order.customerPhone ? `(${order.customerPhone})` : '';
                document.getElementById('order-customer-info').textContent = `${name} ${phone}`.trim();
                customerBox.style.display = 'block';
            } else {
                customerBox.style.display = 'none';
            }

            if (order.customerAddress) {
                document.getElementById('order-address-info').textContent = order.customerAddress;
                addressBox.style.display = 'block';
            } else {
                addressBox.style.display = 'none';
            }

            // Items breakdown
            const items = order.items || order.cart || [];
            const itemsWrapper = document.getElementById('order-items-wrapper');
            if (items.length > 0) {
                let tableHtml = `
                    <table class="order-items-table">
                        <thead>
                            <tr>
                                <th>المنتج</th>
                                <th>الكمية</th>
                                <th>السعر</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                items.forEach(it => {
                    const priceVal = it.price ? (order.currency === 'LYD' ? `${Number(it.price).toFixed(2)} د.ل` : `$${Number(it.price).toFixed(2)}`) : '-';
                    tableHtml += `
                        <tr>
                            <td><strong>${it.name || 'منتج'}</strong></td>
                            <td><span class="order-qty-pill">x${it.quantity || 1}</span></td>
                            <td style="color:#38bdf8; font-weight:700;">${priceVal}</td>
                        </tr>
                    `;
                });
                tableHtml += '</tbody></table>';
                itemsWrapper.innerHTML = tableHtml;
            } else {
                itemsWrapper.innerHTML = '<span>تم تسجيل تفاصيل الطلب بنجاح.</span>';
            }

            // Status Timeline Logic
            const statuses = ['pending', 'processing', 'shipped', 'completed'];
            const currentStatus = (order.status || 'pending').toLowerCase();
            const cancelledNotice = document.getElementById('cancelled-notice');
            const timelineContainer = document.getElementById('status-timeline-container');

            // Reset classes
            document.querySelectorAll('.status-step').forEach(s => s.classList.remove('completed'));

            if (currentStatus === 'cancelled' || currentStatus === 'ملغي') {
                cancelledNotice.style.display = 'block';
                timelineContainer.style.opacity = '0.4';
            } else {
                cancelledNotice.style.display = 'none';
                timelineContainer.style.opacity = '1';

                let activeIndex = statuses.indexOf(currentStatus);
                if (activeIndex === -1) activeIndex = 0;

                if (activeIndex >= 0) document.getElementById('step-pending').classList.add('completed');
                if (activeIndex >= 1) document.getElementById('step-processing').classList.add('completed');
                if (activeIndex >= 2) document.getElementById('step-shipped').classList.add('completed');
                if (activeIndex >= 3) document.getElementById('step-completed').classList.add('completed');
            }

            // WhatsApp button link
            const waMessage = encodeURIComponent(
                `مرحباً، أستفسر بخصوص طلبي من متجر New Desgin:\n` +
                `📋 رقم الطلب: ${displayId}\n` +
                `💰 المجموع: ${totalFormatted}\n` +
                `الحالة المعروضة: ${currentStatus}`
            );
            document.getElementById('btn-order-whatsapp').href = `https://wa.me/${supportPhoneNumber}?text=${waMessage}`;

            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function copyOrderId() {
            if (!currentLoadedOrderId) return;
            navigator.clipboard.writeText(currentLoadedOrderId).then(() => {
                const btnText = document.getElementById('copy-btn-text');
                btnText.textContent = 'تم النسخ! ✅';
                setTimeout(() => {
                    btnText.textContent = 'نسخ الرقم';
                }, 2000);
            }).catch(() => {
                alert('تم نسخ رقم الطلب: ' + currentLoadedOrderId);
            });
        }

        // Initialize and auto-track from URL query params
        function initAutoTracking() {
            const id = getOrderIdFromUrl();
            if (id) {
                const input = document.getElementById('order-input');
                if (input) input.value = id;
                trackOrder(id);
            }

            // Enter key trigger
            const inputEl = document.getElementById('order-input');
            if (inputEl) {
                inputEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleTrackClick();
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Small timeout to guarantee firebase-config has initialized
            setTimeout(initAutoTracking, 300);
        });
    </script>
    <script src="Scripts/instant-page.js" type="module"></script>
    <script src="Scripts/smart-search.js"></script>
    <script src="Scripts/pwa.js"></script>
    <script src="Scripts/seasonal-effects.js"></script>
</body>

</html>
