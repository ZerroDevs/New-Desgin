<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إجراء الحساب - New Desgin</title>
    <link rel="icon" type="image/png" href="Images/Logo-noBG.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="Style/auth.css">
</head>

<body>

    <canvas id="bg-canvas"></canvas>
    <div class="auth-container">
        <!-- Logo Header -->
        <div class="auth-header">
            <a href="index.html">
                <img src="Images/Logo-noBG.png" alt="New Desgin" style="height: 65px; width: auto; object-fit: contain;">
            </a>
            <h2 id="action-title">جاري المعالجة...</h2>
            <p id="action-message">يرجى الانتظار بينما نقوم بمعالجة طلبك</p>
        </div>

        <!-- content area -->
        <div id="action-content">
            <!-- Loading Spinner -->
            <div class="spinner"
                style="margin: 24px auto; width: 44px; height: 44px; border: 3px solid rgba(56, 189, 248, 0.15); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite; box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);">
            </div>
        </div>

        <!-- Password Reset Form (Hidden by default) -->
        <form id="reset-password-form" class="email-form" style="display: none;">
            <div class="input-group">
                <input type="password" id="new-password" placeholder="كلمة المرور الجديدة" required>
            </div>
            <div class="auth-error" id="reset-error"></div>
            <button type="submit" class="submit-btn">تغيير كلمة المرور</button>
        </form>

        <a href="login.html" class="back-link"
            style="display: inline-block; margin-top: 24px; color: var(--accent-color); text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.2s;">العودة لتسجيل
            الدخول</a>
    </div>

    <!-- Styles for animation -->
    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="Scripts/firebase-config.js"></script>
    <script src="Scripts/action-page.js"></script>
    <script src="Scripts/login-animation.js"></script>

</body>

</html>
